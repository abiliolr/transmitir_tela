<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir Transmissão - View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4 sm:p-8">
    <div class="max-w-5xl w-full">
        <h1 class="text-2xl sm:text-3xl font-bold mb-4">Assistindo Transmissão</h1>
        
        <div id="status-container" class="bg-gray-800 p-4 rounded-lg shadow-lg mb-6 flex items-center justify-between">
            <div id="status" class="text-yellow-400">Conectando ao servidor...</div>
        </div>

        <div class="bg-black rounded-lg overflow-hidden border border-gray-700 shadow-2xl">
            <video id="remote-video" class="w-full h-auto" autoplay playsinline controls></video>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mediasoup-client@3/dist/mediasoup-client.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/viewer.js"></script>
</body>
</html>
